services:
  mobysync:
    image: ghcr.io/sbairamis/mobysync:latest
    container_name: mobysync
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      TZ: "Europe/Athens"
      API_KEY: "super-secret-key"
      # Comma-separated container names to skip (e.g. "db,redis"). All other running containers are monitored.
      EXCLUDED_CONTAINERS: ""
      # Discord embed webhook
      DISCORD_WEBHOOK_URL: ""
      # Generic JSON webhook (works with n8n, Zapier, custom endpoints, etc.)
      WEBHOOK_URL: ""
      # Set to "true" to remove dangling images from Docker after each update cycle
      PRUNE_IMAGES: "false"
      # Set to "false" to disable MobySync from automatically updating itself
      SELF_UPDATE: "true"
      # Optional: comma-separated tag overrides. Two formats:
      #   stack:service:tag  → matches a specific Compose service  (e.g. memos:memos:stable)
      #   image:tag          → matches any container using that image (e.g. neosmemo/memos:stable)
      # Per-container labels (com.mobysync.target-tag) always take priority over these.
      # Containers with no match fall back to "latest".
      # IMAGE_TAG_OVERRIDES: "memos:memos:stable,neosmemo/memos:stable"
      UPDATE_HOUR: 23
      UPDATE_MINUTE: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: mount Docker credentials for private registries or authenticated DockerHub pulls.
      # Remove or comment out if you only pull from public images.
      - ~/.docker/config.json:/app/creds/config.json:ro